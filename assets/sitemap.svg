73"/><text x="165.0" y="443.8333333333333" text-anchor="middle" font-family="Arial" font-size="19" fill="#342a26">Фільтр → Картки</text><rect x="320" y="395" width="250" height="85" rx="8" fill="#eee8df" stroke="#897d73"/><text x="445.0" y="443.8333333333333" text-anchor="middle" font-family="Arial" font-size="19" fill="#342a26">Форма → Пара</text><rect x="880" y="395" width="250" height="85" rx="8" fill="#eee8df" stroke="#897d73"/><text x="1005.0" y="443.8333333333333" text-anchor="middle" font-family="Arial" font-size="19" fill="#342a26">Мета проєкту</text><rect x="1160" y="395" width="250" height="85" rx="8" fill="#eee8df" stroke="#897d73"/><text x="1285.0" y="443.8333333333333" text-anchor="middle" font-family="Arial" font-size="19" fill="#342a26">Локальна перевірка</text><text x="40" y="570" font-family="Arial" font-size="25" fill="#342a26">Подальший розвиток: мапа походження · профіль смаку · збережені пари</text><text x="40" y="615" font-family="Arial" font-size="23" fill="#342a26">Ці розділи є планом, у поточному сайті їх ще не реалізовано.</text></svg>